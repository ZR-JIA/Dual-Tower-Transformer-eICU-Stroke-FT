# ==============================================================================
# DualTower Cross-Attention Fusion (DT-CA)
# ==============================================================================
# Left Tower:  Categorical embeddings → projected to d_model token sequence
# Right Tower: Transformer Encoder → full token sequence [B, N_num, d_model]
# Fusion:      Cross-Attention (demographics as Query, vitals as K/V)
#              + Gated combination
#
# Ablation baseline: dualtower.yaml (same towers, static concatenation fusion)
# ==============================================================================

model_config:
  model: dualtower_ca

  # Architecture
  architecture:
    # Right Tower: Transformer (same as dualtower.yaml)
    trans_d_model: 64
    trans_nhead: 4
    trans_num_layers: 2

    # Left Tower: Categorical Embeddings (same as dualtower.yaml)
    cat_features:
      - name: age
        index: 1
        num_classes: 150
        emb_dim: 16
      - name: gender
        index: 2
        num_classes: 10
        emb_dim: 2
      - name: ethnicity
        index: 3
        num_classes: 50
        emb_dim: 4

    # Cross-Attention Fusion
    cross_attention:
      nhead: 4          # Cross-attention heads (can differ from trans_nhead)

    # Classification head (after gated combination)
    fusion_hidden_dim: 64
    dropout: 0.15

  # Loss function (identical to dualtower.yaml for fair comparison)
  loss:
    type: bce
    pos_weight: "${class_imbalance.pos_weight}"

    focal:
      alpha: 0.25
      gamma: 2.0

    label_smoothing:
      smoothing: 0.1

  # Optimizer (identical to dualtower.yaml)
  optimizer:
    name: adamw
    lr: 5e-4
    weight_decay: 3e-4
    betas: [0.9, 0.999]
    eps: 1e-8

  # Learning rate scheduler (identical to dualtower.yaml)
  scheduler:
    name: cosine
    warmup_epochs: 5

    cosine:
      T_max: "${train.training.max_epochs}"
      eta_min: 1e-6

    step:
      step_size: 30
      gamma: 0.1

    plateau:
      mode: max
      factor: 0.5
      patience: 5
      threshold: 1e-4
      min_lr: 1e-6

  # Training loop (identical to dualtower.yaml)
  train_loop:
    batch_size: 512
    grad_clip_norm: 1.0
    accumulate_grad_batches: 1

  # Model initialization
  initialization:
    method: xavier_uniform
    gain: 1.0

  # Calibration post-training
  calibration_after_fit: true

  # Early stopping
  early_stopping:
    enabled: true
    rounds: 50
